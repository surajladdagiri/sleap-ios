[project]
name = "sleap-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "surajladdagiri", email = "152471106+surajladdagiri@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "sleap-io==0.9.2",
    "sleap-nn[export]==0.3.3",
    "torch==2.14.0",
]

[project.scripts]
sleap-python = "sleap_python:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
